apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30686
        hostPort: 16686
        listenAddress: "127.0.0.1"
        protocol: TCP
