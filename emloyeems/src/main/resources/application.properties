spring.application.name=employee-management-service

# Database settings are supplied by the runtime environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employeems?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Optional, idempotent sample data for local demonstration environments.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=${DEFER_DATASOURCE_INITIALIZATION:false}

# Allow Kubernetes to stop the application cleanly.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Expose only the endpoints needed for operation and evidence.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=false

# Tracing export is enabled by the Kubernetes environment when Jaeger is available.
management.tracing.export.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Runtime version information links a deployment to source and image versions.
info.application.name=${spring.application.name}
info.application.version=${APP_VERSION:dev}
info.application.commit=${GIT_COMMIT:local}

